name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows x64"
        type: boolean
        default: true
      publish_all:
        description: "Publish Windows builds (test build)"
        type: boolean
        default: true
      dev_build:
        description: "Show GitHub commit build info in-game"
        type: boolean
        default: true

permissions:
  contents: read

env:
  APP_VERSION: 4.0.0-${{ github.run_id }}
  HAXE_VERSION: 4.3.7
  DEV_BUILD_TAG: dev-build

jobs:
  check_platforms:
    name: Check Build Options
    runs-on: ubuntu-24.04
    outputs:
      build_windows: ${{ steps.set_outputs.outputs.build_windows }}
      publish_all: ${{ steps.set_outputs.outputs.publish_all }}
      dev_build: ${{ steps.set_outputs.outputs.dev_build }}
    steps:
      - id: set_outputs
        run: |
          if [[ "${{ github.event_name }}" == "push" ]] || [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "build_windows=true" >> $GITHUB_OUTPUT
            echo "publish_all=true" >> $GITHUB_OUTPUT
            if [[ "${{ github.ref_name }}" == "dev" ]]; then
              echo "dev_build=true" >> $GITHUB_OUTPUT
            else
              echo "dev_build=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "build_windows=${{ github.event.inputs.build_windows }}" >> $GITHUB_OUTPUT
            echo "publish_all=${{ github.event.inputs.publish_all }}" >> $GITHUB_OUTPUT
            echo "dev_build=${{ github.event.inputs.dev_build }}" >> $GITHUB_OUTPUT
          fi

  build_windows_x64:
    name: Build Windows x64
    runs-on: windows-2025
    needs: check_platforms
    if: needs.check_platforms.outputs.build_windows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          set-safe-directory: false

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          haxelib setup C:\haxelib
          cmd /c setup\windows-lib.bat

      - name: Prepare build
        run: |
          Set-Content -Path VERSION -Value "${{ github.run_id }}"
          @'
          package backend;

          class BuildInfoGenerated
          {
          	public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
          	public static inline final commit:String = "${{ github.sha }}";
          	public static inline final runId:String = "${{ github.run_id }}";
          }
          '@ | Set-Content -Path source/backend/BuildInfoGenerated.hx

      - name: Build
        run: |
          haxelib run lime build Project.xml windows --app-version="${env:APP_VERSION}" -D officialBuild -release

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $buildRoot = "export/release"
          $outDir = Get-ChildItem -Path $buildRoot -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -replace '\\','/' -match '/windows/bin$' } |
            Select-Object -First 1
          if ($null -eq $outDir) {
            Write-Error "Windows output folder was not found under $buildRoot"
            Get-ChildItem -Path export -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            exit 1
          }
          Compress-Archive -Path (Join-Path $outDir.FullName '*') -DestinationPath "dist/FNF-PlusEngine-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-artifact
          path: dist/FNF-PlusEngine-windows-x64.zip
          if-no-files-found: error
          compression-level: 0

  build_windows_x64_opt:
    name: Build Windows x64 (Optimized)
    runs-on: windows-2025
    needs:
      - check_platforms
      - build_windows_x64
    if: needs.check_platforms.outputs.build_windows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          set-safe-directory: false

      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install libraries
        run: |
          haxelib setup C:\haxelib
          cmd /c setup\windows-lib.bat

      - name: Prepare build
        run: |
          Set-Content -Path VERSION -Value "${{ github.run_id }}"
          @'
          package backend;

          class BuildInfoGenerated
          {
          	public static inline final githubDevBuild:Bool = ${{ needs.check_platforms.outputs.dev_build == 'true' }};
          	public static inline final commit:String = "${{ github.sha }}";
          	public static inline final runId:String = "${{ github.run_id }}";
          }
          '@ | Set-Content -Path source/backend/BuildInfoGenerated.hx

      - name: Build
        run: |
          haxelib run lime build Project.xml windows --app-version="${env:APP_VERSION}" -D officialBuild -D OPT_VER -release

      - name: Package artifact
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $buildRoot = "export/opt_release"
          $outDir = Get-ChildItem -Path $buildRoot -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -replace '\\','/' -match '/windows/bin$' } |
            Select-Object -First 1
          if ($null -eq $outDir) {
            Write-Error "Windows optimized output folder was not found under $buildRoot"
            Get-ChildItem -Path export -Directory -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            exit 1
          }
          Compress-Archive -Path (Join-Path $outDir.FullName '*') -DestinationPath "dist/FNF-PlusEngine-windows-x64-opt.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64-opt-artifact
          path: dist/FNF-PlusEngine-windows-x64-opt.zip
          if-no-files-found: error
          compression-level: 0

  summary:
    name: Workflow Summary
    runs-on: ubuntu-24.04
    needs:
      - check_platforms
      - build_windows_x64
      - build_windows_x64_opt
    if: always()

    steps:
      - name: Build tree summary
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(r'''${{ toJson(needs) }}''')
          order = [
              ("build_windows_x64", "Windows x64"),
              ("build_windows_x64_opt", "Windows x64 (opt)"),
          ]
          icons = {
              "success": "[ok]",
              "failure": "[fail]",
              "cancelled": "[stop]",
              "skipped": "[skip]",
          }

          lines = ["## Resumen", "", "```text", "workflow"]
          failed = []

          for index, (job_id, label) in enumerate(order):
              result = needs[job_id]["result"]
              icon = icons.get(result, "[?]")
              branch = "`--" if index == len(order) - 1 else "|--"
              lines.append(f"{branch} {label}: {icon} {result}")
              if result not in ("success", "skipped"):
                  failed.append(label)

          lines.append("```")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")

          if failed:
              sys.exit(1)
          PY

  publish_dev_build:
    name: Publish Dev Build
    runs-on: ubuntu-24.04
    needs:
      - check_platforms
      - summary
    if: |
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/dev' &&
      needs.check_platforms.outputs.publish_all == 'true' &&
      needs.summary.result == 'success'

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Publish prerelease
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ env.DEV_BUILD_TAG }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const tag = process.env.RELEASE_TAG;
            const buildDate = new Date().toISOString().slice(0, 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            async function deleteExistingReleaseAndTag() {
              try {
                const existing = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: existing.data.id,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            function collectFiles(dir) {
              const entries = [];
              if (!fs.existsSync(dir)) return entries;

              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  entries.push(...collectFiles(fullPath));
                } else {
                  entries.push(fullPath);
                }
              }

              return entries;
            }

            function contentTypeFor(filePath) {
              const lower = filePath.toLowerCase();
              if (lower.endsWith('.zip'))
                return 'application/zip';
              if (lower.endsWith('.apk'))
                return 'application/vnd.android.package-archive';
              if (lower.endsWith('.tar.gz'))
                return 'application/gzip';
              return 'application/octet-stream';
            }

            await deleteExistingReleaseAndTag();

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `devbuild ${buildDate}`,
              body: [
                `Build based on the commit ${context.sha}.`,
                `Workflow run: ${context.runId}.`,
                `It was generated by the branch ${context.ref.replace('refs/heads/', '')}.`,
                ``,
                `Assets include standard and optimized Windows builds.`,
              ].join('\n'),
              prerelease: true,
              draft: false,
            });

            const assetDirs = ['release-assets'];

            for (const dir of assetDirs) {
              for (const filePath of collectFiles(dir)) {
                const assetName = path.basename(filePath);
                const data = fs.readFileSync(filePath);
                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id: release.data.id,
                  name: assetName,
                  data,
                  headers: {
                    'content-type': contentTypeFor(filePath),
                    'content-length': data.length,
                  },
                });
              }
            }
